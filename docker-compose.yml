services:


  # ─── Flask API + SocketIO ──────────────────────────────
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports: 
      - "127.0.0.1:5000:5000"
    volumes:
      - "./backend:/backend"
      - "uploads:/backend/uploads"
    working_dir: /backend
    # Apply the pending migrations, then start the API: a fresh database is ready
    # without any manual step. Open SSE streams would otherwise keep every
    # reload and every stop waiting for them forever, so they are cut after 3 s.
    command: >
      sh -c "python -m app.db.migrations.runner &&
      exec uvicorn app.wsgi:app --host 0.0.0.0 --port 5000 --ws-max-size 16384 --reload --timeout-graceful-shutdown 3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 5000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025


  # ─── React + Vite ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend


  # ─── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      -  pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s


  cache:
      image: redis:7
      restart: unless-stopped
      env_file:
      - .env
      environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      ports:
      - "127.0.0.1:6379:6379"
      command: >
        redis-server 
        --requirepass ${REDIS_PASSWORD} 
        --appendonly yes
        --appendfsync everysec
      volumes:
        - redis_data:/data
      healthcheck:
        test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
        interval: 5s
        timeout: 3s
        retries: 5
      


# ─── Mailpit (catch les emails en dev) ─────────────────
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"


volumes:
  pgdata:
  uploads:
  redis_data:
